# Builds a release when `mise run release vX.Y.Z` pushes its tag: the server
# image on ghcr.io, then, with GoReleaser, the terminal interface for macOS
# and Linux and the GitHub release. The tag's commit passed
# `mise run check` before it was pushed, so nothing is tested here.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time; one pushed meanwhile waits for its turn.
concurrency: release

jobs:
  release:
    runs-on: ubuntu-24.04
    # The image takes a few minutes, notarizing each macOS binary up to 20.
    timeout-minutes: 75
    permissions:
      contents: write # the GitHub release
      packages: write # the image and its build cache, and removing old ones
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::$TAG is not a version such as v1.2.3"
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser's notes need the previous tag
          persist-credentials: false

      # mise run release tags only commits on main; a tag pushed some other
      # way must at least be on main.
      - name: Check that the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$TAG is not on main; release with mise run release"
            exit 1
          }

      # Every release builds Garner's TheTVDB key into the server, so users
      # need none of their own.
      - name: Check that the TheTVDB key is set
        env:
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
        run: |
          [ -n "$TVDB_API_KEY" ] || {
            echo "::error::the repository secret TVDB_API_KEY is missing"
            exit 1
          }

      # Without them, GoReleaser would leave the macOS binaries unsigned and
      # the Homebrew cask out of date.
      - name: Check that the signing and Homebrew secrets are set
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID HOMEBREW_TAP_KEY; do
            [ -n "${!name}" ] || {
              echo "::error::the repository secret $name is missing"
              exit 1
            }
          done

      # latest names the newest version on main, which the Compose example
      # pulls, and only the newest updates the Homebrew cask; a rerun of an
      # older release leaves both alone.
      - name: Choose the image tags
        id: tags
        run: |
          newest=$(git tag --merged origin/main | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          tags="$IMAGE:$TAG"
          [ "$newest" != "$TAG" ] || tags="$tags,$IMAGE:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "newest=$([ "$newest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Read the tool versions from mise.toml
        id: tools
        run: |
          echo "go=$(sed -n 's/^go = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
          echo "goreleaser=$(sed -n 's/^goreleaser = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The build cache lives on ghcr.io, so FFprobe is compiled only when
      # the Dockerfile's FFmpeg changes; GitHub's own cache expires after a
      # week without use. One image, no attestations, so the digest names
      # exactly what a server runs.
      - name: Build and push the server image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
          secrets: |
            tvdb_api_key=${{ secrets.TVDB_API_KEY }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: false
          sbom: false

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v${{ steps.tools.outputs.goreleaser }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ env.TAG }}@${{ steps.image.outputs.digest }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
          NEWEST_RELEASE: ${{ steps.tags.outputs.newest }}

      # The container registry is free for now; keeping twenty versions
      # (images and their build cache) stays small if that changes. The
      # release is out by now, so a failure here must not fail it.
      - name: Remove old images
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: garner
          package-type: container
          min-versions-to-keep: 20
