# GoReleaser builds a release's terminal interface for macOS and Linux, on
# ARM and x86, and creates the GitHub release with it. The
# release workflow builds the server image first and passes its reference
# as IMAGE_REF. Try a release without publishing anything:
#   goreleaser release --snapshot --clean
version: 2
project_name: garner

builds:
  - id: garner
    main: ./cmd/garner
    binary: garner
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Tag }} -X main.commit={{ .FullCommit }}"]
    targets: [darwin_arm64, darwin_amd64_v1, linux_amd64_v1, linux_arm64_v8.0]

# Signs and notarizes the macOS binaries with Garner's Developer ID, so
# macOS opens them without a warning. The release workflow sets the Apple
# credentials; without them, as in a snapshot, the binaries stay unsigned.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [garner]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - formats: [binary]
    name_template: "garner-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
  # The notices file travels with the binaries, so its sum is in here too.
  extra_files:
    - glob: THIRD-PARTY-NOTICES.txt

# A Homebrew cask in trucke/homebrew-tap, for brew install trucke/tap/garner
# and brew upgrade. The release workflow sets the tap's deploy key and says
# whether this is the newest release; otherwise the cask is only written
# into dist/.
homebrew_casks:
  - name: garner
    binaries: [garner]
    homepage: https://github.com/trucke/garner
    description: Terminal interface for Garner, a self-hosted TV and anime manager
    license: MIT
    commit_msg_template: "Update garner to {{ .Tag }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    skip_upload: '{{ if and (isEnvSet "HOMEBREW_TAP_KEY") (eq (envOrDefault "NEWEST_RELEASE" "") "true") }}false{{ else }}true{{ end }}'
    repository:
      owner: trucke
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:trucke/homebrew-tap.git
        private_key: '{{ envOrDefault "HOMEBREW_TAP_KEY" "" }}'

# The commits since the previous release, newest first, as git lists them.
changelog:
  use: git
  format: "{{ .Message }}"

release:
  name_template: "Garner {{ .Tag }}"
  header: |
    Server image: `{{ envOrDefault "IMAGE_REF" "not built in this run" }}`
  extra_files:
    - glob: THIRD-PARTY-NOTICES.txt
