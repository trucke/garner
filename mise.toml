[tools]
go = "1.27.3"
sqlc = "1.31.1"
air = "1.67.4"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:github.com/google/go-licenses/v2" = "2.0.1"
goreleaser = "2.18.3"
# The same in mise run check and on GitHub; versions disagree on what they flag.
shellcheck = "0.11.0"

[tasks.build]
description = "Build bin/garner (the terminal interface) and bin/garnerd (the server)"
run = ["go build -o bin/garner ./cmd/garner", "go build -o bin/garnerd ./cmd/garnerd"]

# Air (.air.toml) builds bin/garnerd, runs it and rebuilds and restarts it
# on every code change. Garner uses the garner.toml that devstack writes;
# the stack's API keys come from its secrets folder, the TVDB key from
# TVDB_API_KEY in the environment (for example in mise.local.toml).
[tasks.dev]
description = "Run Garner against the local dev stack and rebuild it on code changes (start the stack with mise run devstack up)"
env = { SABNZBD_API_KEY_FILE = "{{env.HOME}}/garner-dev/secrets/sabnzbd_api_key", PROWLARR_API_KEY_FILE = "{{env.HOME}}/garner-dev/secrets/prowlarr_api_key", JELLYFIN_API_KEY_FILE = "{{env.HOME}}/garner-dev/secrets/jellyfin_api_key" }
run = "air"

[tasks.tui]
description = "Build bin/garner and open the terminal interface"
raw = true
run = ["go build -o bin/garner ./cmd/garner", "./bin/garner"]

# Checks the working copy on macOS and on Linux; run it before every push.
[tasks.check]
description = "Check the working copy on macOS and Linux; run it before every push"
run = "bash tools/check.sh"

# Releases a commit of main, the newest by default:
# mise run release vX.Y.Z [revision]. GitHub then builds the image and,
# with GoReleaser, the terminal interface and the release.
[tasks.release]
description = "Release a commit of main as a version: tag it and let GitHub build the image and the release"
run = "bash tools/release.sh"

# The stack's Usenet server and indexers come from devstack.toml.
[tasks.devstack]
description = "Control the local dev stack (SABnzbd, Prowlarr, Jellyfin in Podman): up, down, reset or status"
run = "go run ./tools/devstack"

[tasks.clean]
description = "Remove the build output and the dev stack's scratch folder (~/garner-dev/scratch)"
run = "bash tools/clean.sh"

[tasks.notices]
description = "Regenerate THIRD-PARTY-NOTICES.txt from the Go modules the release platforms compile in"
run = "go run ./tools/notices"

[tasks.generate]
description = "Regenerate database code with sqlc"
run = "go generate ./..."

[tasks.image]
description = "Build the container image localhost/garner:dev with Podman"
run = 'podman build --build-arg VERSION="dev-$(git rev-parse --short=12 HEAD)" -t localhost/garner:dev .'
